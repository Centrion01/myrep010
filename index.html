<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер валют</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: #ffffff;
            --text-main: #333;
            --text-muted: #888;
            --text-soft: #555;
            --border: #eee;
            --input-bg: #ffffff;
            --panel-bg: linear-gradient(135deg, #f5f7fa 0%, #e8ecf5 100%);
            --currency-card-bg: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --base-card-bg: linear-gradient(135deg, #fff9c4 0%, #ffe082 100%);
            --primary: #667eea;
            --primary-dark: #764ba2;
            --accent: #ffa000;
            --shadow: rgba(0,0,0,0.3);
            --history-bg: #f8f9fc;
        }

        body.dark {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --card-bg: #1f2937;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --text-soft: #d1d5db;
            --border: #374151;
            --input-bg: #111827;
            --panel-bg: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            --currency-card-bg: linear-gradient(135deg, #374151 0%, #1f2937 100%);
            --base-card-bg: linear-gradient(135deg, #78350f 0%, #451a03 100%);
            --primary: #818cf8;
            --primary-dark: #a78bfa;
            --accent: #fbbf24;
            --shadow: rgba(0,0,0,0.6);
            --history-bg: #111827;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            transition: background 0.4s;
        }

        /* ========== ЭКРАН ВХОДА ========== */
        #loginScreen {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px var(--shadow);
            max-width: 420px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.4s ease;
            margin: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lock-icon { font-size: 60px; margin-bottom: 15px; }

        #loginScreen h2 {
            color: var(--text-main);
            margin-bottom: 10px;
            font-size: 24px;
        }

        #loginScreen p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .password-wrap { position: relative; margin-bottom: 20px; }

        #passwordInput {
            width: 100%;
            font-size: 20px;
            padding: 15px 50px 15px 20px;
            border: 2px solid var(--primary);
            border-radius: 12px;
            text-align: center;
            outline: none;
            transition: all 0.3s;
            letter-spacing: 3px;
            font-weight: 600;
            background: var(--input-bg);
            color: var(--text-main);
        }

        #passwordInput:focus {
            border-color: var(--primary-dark);
            box-shadow: 0 0 20px rgba(118, 75, 162, 0.3);
        }

        .toggle-eye {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 20px;
            user-select: none;
            opacity: 0.6;
        }

        .toggle-eye:hover { opacity: 1; }

        #loginBtn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #loginBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        #loginError {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
            font-weight: 600;
        }

        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* ========== КОНВЕРТЕР ========== */
        #appContainer {
            display: none;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px var(--shadow);
            max-width: 1100px;
            width: 100%;
            margin: 20px 0;
            transition: background 0.4s;
        }

        #appContainer.unlocked {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        /* Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            color: var(--text-main);
            font-size: 24px;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-btn {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-main);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .header-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .header-btn.danger {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        .header-btn.danger:hover {
            background: #e74c3c;
            color: white;
        }

        /* Language + Theme buttons */
        .lang-switch {
            display: flex;
            gap: 4px;
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 4px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: var(--primary);
            color: white;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 14px;
        }

        /* Панель базовой валюты */
        .base-selector {
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 22px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--primary);
        }

        .base-selector label {
            color: var(--text-soft);
            font-weight: 600;
            font-size: 15px;
        }

        .base-selector select {
            font-size: 17px;
            padding: 11px 18px;
            border: 2px solid var(--primary);
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            outline: none;
            min-width: 240px;
            transition: all 0.3s;
        }

        .amount-input { display: flex; align-items: center; gap: 10px; }

        .amount-input input {
            font-size: 22px;
            padding: 10px 18px;
            border: 2px solid var(--primary);
            border-radius: 10px;
            text-align: center;
            width: 170px;
            outline: none;
            font-weight: bold;
            background: var(--input-bg);
            color: var(--text-main);
            transition: all 0.3s;
        }

        .amount-input input:focus {
            border-color: var(--primary-dark);
            box-shadow: 0 0 15px rgba(118, 75, 162, 0.3);
        }

        /* Поиск */
        .search-wrap {
            margin-bottom: 20px;
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 12px 45px 12px 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        #searchInput:focus {
            border-color: var(--primary);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.5;
        }

        /* Сетка */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .currency-card {
            background: var(--currency-card-bg);
            border-radius: 15px;
            padding: 20px 15px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            border-left: 5px solid var(--primary);
            position: relative;
            color: var(--text-main);
        }

        .currency-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px var(--shadow);
        }

        .currency-card.base-card {
            background: var(--base-card-bg);
            border-left-color: var(--accent);
            box-shadow: 0 0 25px rgba(255, 160, 0, 0.4);
        }

        .currency-card.base-card::after {
            content: attr(data-base-label);
            position: absolute;
            top: -10px;
            right: 15px;
            background: var(--accent);
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 1px;
        }

        .currency-card.favorite-card {
            border-left-color: #f59e0b;
        }

        .flag { font-size: 32px; margin-bottom: 8px; }

        .currency-name {
            color: var(--text-soft);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-height: 16px;
        }

        .currency-value {
            color: var(--text-main);
            font-size: 19px;
            font-weight: bold;
            word-break: break-word;
            min-height: 26px;
        }

        .currency-code {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 5px;
        }

        .card-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .mini-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mini-btn:hover { background: var(--primary-dark); }

        .mini-btn.active {
            background: var(--accent);
            cursor: default;
        }

        .mini-btn.fav-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 5px 8px;
        }

        .mini-btn.fav-btn:hover {
            border-color: #f59e0b;
            color: #f59e0b;
        }

        .mini-btn.fav-btn.faved {
            background: #fef3c7;
            border-color: #f59e0b;
            color: #f59e0b;
        }

        body.dark .mini-btn.fav-btn.faved {
            background: #78350f;
            color: #fbbf24;
            border-color: #fbbf24;
        }

        /* История */
        .history-section {
            background: var(--history-bg);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid var(--border);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .history-header h3 {
            color: var(--text-main);
            font-size: 16px;
        }

        .history-list {
            max-height: 250px;
            overflow-y: auto;
        }

        .history-item {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-soft);
            border-left: 3px solid var(--primary);
            cursor: pointer;
            transition: transform 0.15s;
        }

        .history-item:hover {
            transform: translateX(3px);
        }

        .history-time {
            color: var(--text-muted);
            font-size: 11px;
        }

        .empty-history {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-size: 13px;
        }

        .clear-history-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-history-btn:hover {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        .rate-info {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            padding-top: 15px;
            margin-top: 15px;
            border-top: 1px solid var(--border);
        }

        .error { color: #e74c3c; text-align: center; padding: 10px; font-size: 14px; }
        .loading { color: var(--primary); text-align: center; padding: 10px; }

        @media (max-width: 600px) {
            #appContainer { padding: 18px 12px; }
            h1 { font-size: 18px; }
            .base-selector { flex-direction: column; padding: 15px; }
            .base-selector select { min-width: 100%; font-size: 15px; }
            .amount-input input { font-size: 18px; width: 130px; }
            .currency-value { font-size: 16px; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .currency-card { padding: 15px 8px; }
            .header-buttons { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

        const logoutBtn = document.getElementById('logoutBtn');
        const loginTitle = document.getElementById('loginTitle');
        const loginSubtitle = document.getElementById('loginSubtitle');

        const baseSelect = document.getElementById('baseCurrency');
        const amountInput = document.getElementById('amountInput');
        const rateInfo = document.getElementById('rateInfo');
        const grid = document.getElementById('currencyGrid');
        const searchInput = document.getElementById('searchInput');
        const historyList = document.getElementById('historyList');
        const historyTitle = document.getElementById('historyTitle');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const appTitle = document.getElementById('appTitle');
        const appSubtitle = document.getElementById('appSubtitle');
        const labelBase = document.getElementById('labelBase');
        const labelAmount = document.getElementById('labelAmount');

        /* ============================================================
           Состояние
           ============================================================ */
        let rates = {};
        let baseCurrency = 'USD';
        let searchQuery = '';
        let favorites = JSON.parse(localStorage.getItem('converter_favorites') || '[]');
        let history = JSON.parse(localStorage.getItem('converter_history') || '[]');
        let appInitialized = false;
        let historyDebounce = null;
        let theme = localStorage.getItem('converter_theme') || 'light';

        /* ============================================================
           Тема
           ============================================================ */
        function applyTheme() {
            if (theme === 'dark') {
                document.body.classList.add('dark');
                document.getElementById('themeToggle').textContent = '☀️';
            } else {
                document.body.classList.remove('dark');
                document.getElementById('themeToggle').textContent = '🌙';
            }
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            theme = theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('converter_theme', theme);
            applyTheme();
        });

        /* ============================================================
           Применение языка
           ============================================================ */
        function applyLanguage() {
            document.documentElement.lang = currentLang;

            loginTitle.textContent = t('loginTitle');
            loginSubtitle.textContent = t('loginSubtitle');
            loginBtn.textContent = t('loginBtn');
            passwordInput.placeholder = t('loginPlaceholder');

            appTitle.textContent = t('appTitle');
            appSubtitle.textContent = t('appSubtitle');
            labelBase.textContent = t('labelBase');
            labelAmount.textContent = t('labelAmount');
            searchInput.placeholder = t('searchPlaceholder');
            historyTitle.textContent = t('historyTitle');
            clearHistoryBtn.textContent = t('clearHistory');
            logoutBtn.textContent = t('logout');

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
            });

            // Обновить названия валют в селекте
            Array.from(baseSelect.options).forEach(opt => {
                const cur = CURRENCIES[opt.value];
                if (cur) {
                    opt.textContent = `${cur.flag} ${t(cur.nameKey)} (${cur.code})`;
                }
            });

            renderGrid();
            renderHistory();
            if (Object.keys(rates).length > 0) updateRateInfo();
        }

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentLang = btn.dataset.lang;
                localStorage.setItem('converter_lang', currentLang);
                applyLanguage();
            });
        });

        /* ============================================================
           Логика входа
           ============================================================ */
        function tryLogin() {
            const entered = passwordInput.value;
            if (entered === SECRET_PASSWORD) {
                loginError.textContent = '';
                loginScreen.style.display = 'none';
                appContainer.classList.add('unlocked');
                sessionStorage.setItem('converter_logged_in', '1');
                if (!appInitialized) {
                    appInitialized = true;
                    initConverter();
                }
                passwordInput.value = '';
            } else {
                loginError.textContent = t('wrongPassword');
                passwordInput.value = '';
                passwordInput.focus();
                loginScreen.classList.remove('shake');
                void loginScreen.offsetWidth;
                loginScreen.classList.add('shake');
            }
        }

        loginBtn.addEventListener('click', tryLogin);
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') tryLogin();
        });

        toggleEye.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleEye.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleEye.textContent = '👁️';
            }
        });

        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('converter_logged_in');
            location.reload();
        });

        /* ============================================================
           Автовход
           ============================================================ */
        if (sessionStorage.getItem('converter_logged_in') === '1') {
            loginScreen.style.display = 'none';
            appContainer.classList.add('unlocked');
            appInitialized = true;
            initConverter();
        }

        /* ============================================================
           Утилиты
           ============================================================ */
        function formatNumber(num) {
            if (!isFinite(num)) return '—';
            if (num >= 1000) {
                return num.toLocaleString('ru-RU', { maximumFractionDigits: 2 });
            }
            if (num >= 1) {
                return num.toFixed(2);
            }
            return num.toFixed(4);
        }

        function convert(amount, from, to) {
            if (!rates[from] || !rates[to]) return null;
            return amount * (rates[to] / rates[from]);
        }

        function getCurrencyDisplayName(key) {
            return t(CURRENCIES[key].nameKey);
        }

        /* ============================================================
           Рендер карточек
           ============================================================ */
        function renderGrid() {
            const amount = parseFloat(amountInput.value) || 0;
            grid.innerHTML = '';

            const filteredKeys = Object.keys(CURRENCIES).filter(key => {
                if (!searchQuery) return true;
                const cur = CURRENCIES[key];
                const name = getCurrencyDisplayName(key).toLowerCase();
                return name.includes(searchQuery) ||
                       cur.code.toLowerCase().includes(searchQuery) ||
                       key.toLowerCase().includes(searchQuery);
            });

            if (filteredKeys.length === 0) {
                grid.innerHTML = `<div class="empty-history" style="grid-column: 1/-1;">🔍 ${t('emptyHistory')}</div>`;
                return;
            }

            filteredKeys.forEach(key => {
                const cur = CURRENCIES[key];
                const isBase = key === baseCurrency;
                const isFav = favorites.includes(key);

                const card = document.createElement('div');
                card.className = 'currency-card' + (isBase ? ' base-card' : '') + (isFav ? ' favorite-card' : '');
                card.style.borderLeftColor = cur.color;
                if (isBase) card.dataset.baseLabel = t('baseLabel');

                let displayValue;
                if (isBase) {
                    displayValue = formatNumber(amount) + ' ' + cur.symbol;
                } else {
                    const result = convert(amount, baseCurrency, key);
                    displayValue = result !== null ? formatNumber(result) + ' ' + cur.symbol : '—';
                }

                card.innerHTML = `
                    <div class="flag">${cur.flag}</div>
                    <div class="currency-name">${getCurrencyDisplayName(key)}</div>
                    <div class="currency-value">${displayValue}</div>
                    <div class="currency-code">${cur.code}</div>
                    <div class="card-actions">
                        ${isBase
                            ? `<button class="mini-btn active">${t('isBase')}</button>`
                            : `<button class="mini-btn" data-swap="${key}">${t('makeBase')}</button>`}
                        <button class="mini-btn fav-btn ${isFav ? 'faved' : ''}" data-fav="${key}">⭐</button>
                    </div>
                `;

                const swapBtn = card.querySelector('[data-swap]');
                if (swapBtn) {
                    swapBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        baseCurrency = key;
                        baseSelect.value = key;
                        renderGrid();
                    });
                }

                const favBtn = card.querySelector('[data-fav]');
                favBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (favorites.includes(key)) {
                        favorites = favorites.filter(k => k !== key);
                    } else {
                        favorites.push(key);
                    }
                    localStorage.setItem('converter_favorites', JSON.stringify(favorites));
                    renderGrid();
                });

                grid.appendChild(card);
            });
        }

        /* ============================================================
           История
           ============================================================ */
        function addToHistory() {
            const amount = parseFloat(amountInput.value) || 0;
            if (amount <= 0) return;

            // Убираем предыдущую запись с той же базовой валютой в пределах 3 сек
            if (historyDebounce) clearTimeout(historyDebounce);

            historyDebounce = setTimeout(() => {
                const last = history[0];
                const entry = {
                    base: baseCurrency,
                    amount: amount,
                    time: Date.now()
                };
                // Если последняя запись с такой же базовой и суммой — не дублируем
                if (!last || last.base !== entry.base || Math.abs(last.amount - entry.amount) > 0.0001) {
                    history.unshift(entry);
                    if (history.length > 15) history = history.slice(0, 15);
                    localStorage.setItem('converter_history', JSON.stringify(history));
                    renderHistory();
                }
            }, 800);
        }

        function renderHistory() {
            historyList.innerHTML = '';
            if (history.length === 0) {
                historyList.innerHTML = `<div class="empty-history">${t('emptyHistory')}</div>`;
                return;
            }
            history.forEach(entry => {
                const cur = CURRENCIES[entry.base];
                if (!cur) return;
                const div = document.createElement('div');
                div.className = 'history-item';
                const date = new Date(entry.time);
                const timeStr = date.toLocaleString(currentLang === 'en' ? 'en-US' : 'ru-RU', {
                    hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit'
                });
                div.innerHTML = `
                    <span>${cur.flag} ${formatNumber(entry.amount)} ${cur.symbol} → ${t('appTitle').split(' ')[0]}</span>
                    <span class="history-time">${timeStr}</span>
                `;
                // Клик — восстановить
                div.addEventListener('click', () => {
                    baseCurrency = entry.base;
                    baseSelect.value = entry.base;
                    amountInput.value = entry.amount;
                    renderGrid();
                });
                historyList.appendChild(div);
            });
        }

        clearHistoryBtn.addEventListener('click', () => {
            history = [];
            localStorage.removeItem('converter_history');
            renderHistory();
        });

        /* ============================================================
           Курсы
           ============================================================ */
        function updateRateInfo(updateDate) {
            if (updateDate) {
                rateInfo.innerHTML = `${t('ratesUpdated')} ${updateDate.toLocaleString()}<br>
                    <small>${t('ratesSource')}</small>`;
            } else {
                rateInfo.innerHTML = `${t('ratesFallback')}`;
            }
        }

        async function loadRates() {
            rateInfo.innerHTML = `<span class="loading">${t('rateLoading')}</span>`;
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                if (data && data.rates) {
                    rates = {
                        USD: 1,
                        AZN: data.rates.AZN,
                        EUR: data.rates.EUR,
                        TRY: data.rates.TRY,
                        RUB: data.rates.RUB,
                        IRR: data.rates.IRR
                    };
                    renderGrid();
                    updateRateInfo(new Date(data.time_last_update_utc));
                } else {
                    throw new Error('No rates');
                }
            } catch (e) {
                rates = { USD: 1, AZN: 1.70, EUR: 0.92, TRY: 34.50, RUB: 92.50, IRR: 42000 };
                renderGrid();
                updateRateInfo();
            }
        }

        /* ============================================================
           Инициализация
           ============================================================ */
        function initConverter() {
            applyTheme();
            applyLanguage();

            amountInput.addEventListener('input', () => {
                renderGrid();
                addToHistory();
            });

            baseSelect.addEventListener('change', () => {
                baseCurrency = baseSelect.value;
                renderGrid();
                addToHistory();
            });

            searchInput.addEventListener('input', () => {
                searchQuery = searchInput.value.toLowerCase().trim();
                renderGrid();
            });

            loadRates();
            passwordInput.value = '';
        }

        // Первичное применение темы и языка даже до входа
        applyTheme();
    </script>
</body>
</html>
