<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер валют - Защищённый</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ========== ЭКРАН ВХОДА ========== */
        #loginScreen {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 420px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lock-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        #loginScreen h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        #loginScreen p {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .password-wrap {
            position: relative;
            margin-bottom: 20px;
        }

        #passwordInput {
            width: 100%;
            font-size: 20px;
            padding: 15px 50px 15px 20px;
            border: 2px solid #667eea;
            border-radius: 12px;
            text-align: center;
            outline: none;
            transition: all 0.3s;
            letter-spacing: 3px;
            font-weight: 600;
        }

        #passwordInput:focus {
            border-color: #764ba2;
            box-shadow: 0 0 20px rgba(118, 75, 162, 0.3);
        }

        .toggle-eye {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 20px;
            user-select: none;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .toggle-eye:hover {
            opacity: 1;
        }

        #loginBtn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #loginBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        #loginBtn:active {
            transform: translateY(0);
        }

        #loginError {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
            font-weight: 600;
        }

        .shake {
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* ========== КОНВЕРТЕР (скрыт по умолчанию) ========== */
        #appContainer {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1000px;
            width: 100%;
            margin: 20px 0;
        }

        #appContainer.unlocked {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            font-size: 26px;
        }

        #logoutBtn {
            background: #fff0f0;
            color: #e74c3c;
            border: 2px solid #e74c3c;
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        #logoutBtn:hover {
            background: #e74c3c;
            color: white;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .base-selector {
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf5 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: center;
            border: 2px dashed #667eea;
        }

        .base-selector label {
            color: #555;
            font-weight: 600;
            font-size: 15px;
        }

        .base-selector select {
            font-size: 18px;
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 10px;
            background: white;
            color: #333;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.3s;
            min-width: 250px;
        }

        .base-selector select:focus {
            border-color: #764ba2;
            box-shadow: 0 0 15px rgba(118, 75, 162, 0.3);
        }

        .amount-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .amount-input input {
            font-size: 22px;
            padding: 10px 18px;
            border: 2px solid #667eea;
            border-radius: 10px;
            text-align: center;
            width: 180px;
            outline: none;
            transition: all 0.3s;
            font-weight: bold;
            color: #333;
        }

        .amount-input input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 15px rgba(118, 75, 162, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .currency-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 22px 18px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            border-left: 5px solid #667eea;
            position: relative;
        }

        .currency-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .currency-card.base-card {
            background: linear-gradient(135deg, #fff9c4 0%, #ffe082 100%);
            border-left-color: #ffa000;
            box-shadow: 0 0 25px rgba(255, 160, 0, 0.4);
        }

        .currency-card.base-card::after {
            content: "БАЗОВАЯ";
            position: absolute;
            top: -10px;
            right: 15px;
            background: #ffa000;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 1px;
        }

        .flag {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .currency-name {
            color: #555;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .currency-value {
            color: #333;
            font-size: 20px;
            font-weight: bold;
            word-break: break-word;
            min-height: 28px;
        }

        .currency-code {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }

        .swap-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }

        .swap-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .swap-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .swap-btn.active {
            background: #ffa000;
            cursor: default;
        }

        .swap-btn.active:hover {
            transform: none;
        }

        .rate-info {
            text-align: center;
            color: #999;
            font-size: 12px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .error {
            color: #e74c3c;
            text-align: center;
            padding: 10px;
            font-size: 14px;
        }

        .loading {
            color: #667eea;
            text-align: center;
            padding: 10px;
        }

        @media (max-width: 600px) {
            #appContainer {
                padding: 20px 15px;
            }
            h1 {
                font-size: 18px;
            }
            .base-selector {
                padding: 18px;
                flex-direction: column;
            }
            .base-selector select {
                min-width: 100%;
                font-size: 16px;
            }
            .amount-input input {
                font-size: 18px;
                width: 140px;
            }
            .currency-value {
                font-size: 16px;
            }
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .currency-card {
                padding: 15px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ========== ЭКРАН ВХОДА ========== -->
    <div id="loginScreen">
        <div class="lock-icon">🔒</div>
        <h2>Доступ закрыт</h2>
        <p>Введите пароль для входа в конвертер</p>

        <div class="password-wrap">
            <input type="password" id="passwordInput" placeholder="Пароль" autocomplete="off">
            <span class="toggle-eye" id="toggleEye">👁️</span>
        </div>

        <button id="loginBtn">Войти</button>
        <div id="loginError"></div>
    </div>

    <!-- ========== КОНВЕРТЕР ========== -->
    <div id="appContainer">
        <div class="app-header">
            <h1>💱 Мультивалютный конвертер</h1>
            <button id="logoutBtn">Выйти</button>
        </div>
        <p class="subtitle">Выберите базовую валюту и введите сумму — получите результат во всех остальных</p>

        <div class="base-selector">
            <label for="baseCurrency">Базовая валюта:</label>
            <select id="baseCurrency">
                <option value="USD">🇺🇸 Доллар США (USD)</option>
                <option value="AZN">🇦🇿 Азербайджанский манат (AZN)</option>
                <option value="EUR">🇪🇺 Евро (EUR)</option>
                <option value="TRY">🇹🇷 Турецкая лира (TRY)</option>
                <option value="RUB">🇷🇺 Российский рубль (RUB)</option>
                <option value="IRR">🇮🇷 Иранский риал (IRR)</option>
            </select>

            <div class="amount-input">
                <label for="amountInput">Сумма:</label>
                <input type="number" id="amountInput" value="1" min="0" step="0.01">
            </div>
        </div>

        <div class="grid" id="currencyGrid"></div>

        <div class="rate-info" id="rateInfo">Загрузка курсов...</div>
    </div>

    <script>
        /* ============================================================
           🔑 ПАРОЛЬ
           ============================================================ */
        const SECRET_PASSWORD = "kenan8";

        /* ============================================================
           ЛОГИКА ВХОДА
           ============================================================ */
        const loginScreen = document.getElementById('loginScreen');
        const appContainer = document.getElementById('appContainer');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const toggleEye = document.getElementById('toggleEye');
        const logoutBtn = document.getElementById('logoutBtn');

        let appInitialized = false;

        function tryLogin() {
            const entered = passwordInput.value;

            if (entered === SECRET_PASSWORD) {
                loginError.textContent = '';
                loginScreen.style.display = 'none';
                appContainer.classList.add('unlocked');

                // Сохраняем, что пользователь вошёл
                sessionStorage.setItem('converter_logged_in', '1');

                // Инициализируем конвертер только один раз
                if (!appInitialized) {
                    appInitialized = true;
                    initConverter();
                }
                passwordInput.value = '';
            } else {
                loginError.textContent = '❌ Неверный пароль. Попробуйте ещё раз.';
                passwordInput.value = '';
                passwordInput.focus();

                // Тряска для наглядности
                loginScreen.classList.remove('shake');
                void loginScreen.offsetWidth;
                loginScreen.classList.add('shake');
            }
        }

        loginBtn.addEventListener('click', tryLogin);

        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') tryLogin();
        });

        // Показать/скрыть пароль
        toggleEye.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleEye.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleEye.textContent = '👁️';
            }
        });

        // Выход — сбрасываем сессию и перезагружаем страницу
        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('converter_logged_in');
            location.reload();
        });

        // Автовход в рамках текущей вкладки (пока не закрыта)
        if (sessionStorage.getItem('converter_logged_in') === '1') {
            loginScreen.style.display = 'none';
            appContainer.classList.add('unlocked');
            appInitialized = true;
            initConverter();
        }

        /* ============================================================
           ЛОГИКА КОНВЕРТЕРА
           ============================================================ */
        const CURRENCIES = {
            USD: { name: 'Доллар США', code: 'USD', symbol: '$', flag: '🇺🇸', color: '#2e7d32' },
            AZN: { name: 'Азербайджанский манат', code: 'AZN', symbol: '₼', flag: '🇦🇿', color: '#00a651' },
            EUR: { name: 'Евро', code: 'EUR', symbol: '€', flag: '🇪🇺', color: '#003399' },
            TRY: { name: 'Турецкая лира', code: 'TRY', symbol: '₺', flag: '🇹🇷', color: '#e30a17' },
            RUB: { name: 'Российский рубль', code: 'RUB', symbol: '₽', flag: '🇷🇺', color: '#d52b1e' },
            IRR: { name: 'Иранский риал', code: 'IRR', symbol: '﷼', flag: '🇮🇷', color: '#239f40' }
        };

        const baseSelect = document.getElementById('baseCurrency');
        const amountInput = document.getElementById('amountInput');
        const rateInfo = document.getElementById('rateInfo');
        const grid = document.getElementById('currencyGrid');

        let rates = {};
        let baseCurrency = 'USD';

        function formatNumber(num) {
            if (!isFinite(num)) return '—';
            if (num >= 1000) {
                return num.toLocaleString('ru-RU', { maximumFractionDigits: 2 });
            }
            if (num >= 1) {
                return num.toFixed(2);
            }
            return num.toFixed(4);
        }

        function convert(amount, from, to) {
            if (!rates[from] || !rates[to]) return null;
            return amount * (rates[to] / rates[from]);
        }

        function renderGrid() {
            const amount = parseFloat(amountInput.value) || 0;
            grid.innerHTML = '';

            Object.keys(CURRENCIES).forEach(key => {
                const cur = CURRENCIES[key];
                const isBase = key === baseCurrency;

                const card = document.createElement('div');
                card.className = 'currency-card' + (isBase ? ' base-card' : '');
                card.style.borderLeftColor = cur.color;

                let displayValue;
                if (isBase) {
                    displayValue = formatNumber(amount) + ' ' + cur.symbol;
                } else {
                    const result = convert(amount, baseCurrency, key);
                    displayValue = result !== null ? formatNumber(result) + ' ' + cur.symbol : '—';
                }

                card.innerHTML = `
                    <div class="flag">${cur.flag}</div>
                    <div class="currency-name">${cur.name}</div>
                    <div class="currency-value">${displayValue}</div>
                    <div class="currency-code">${cur.code}</div>
                    ${isBase
                        ? `<div class="swap-buttons"><button class="swap-btn active">★ Базовая</button></div>`
                        : `<div class="swap-buttons"><button class="swap-btn" data-swap="${key}">↔ Сделать базовой</button></div>`}
                `;

                if (!isBase) {
                    card.querySelector('.swap-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        baseCurrency = key;
                        baseSelect.value = key;
                        renderGrid();
                    });

                    card.style.cursor = 'pointer';
                    card.addEventListener('click', () => {
                        baseCurrency = key;
                        baseSelect.value = key;
                        renderGrid();
                    });
                }

                grid.appendChild(card);
            });
        }

        async function loadRates() {
            rateInfo.innerHTML = '<span class="loading">⏳ Загрузка актуальных курсов...</span>';
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();

                if (data && data.rates) {
                    rates = {
                        USD: 1,
                        AZN: data.rates.AZN,
                        EUR: data.rates.EUR,
                        TRY: data.rates.TRY,
                        RUB: data.rates.RUB,
                        IRR: data.rates.IRR
                    };

                    renderGrid();

                    const updateDate = new Date(data.time_last_update_utc);
                    rateInfo.innerHTML = `✅ Курсы обновлены: ${updateDate.toLocaleString('ru-RU')}<br>
                    <small>Источник: open.er-api.com · Все курсы относительно USD</small>`;
                } else {
                    throw new Error('Не удалось получить курсы');
                }
            } catch (error) {
                console.error(error);
                rateInfo.innerHTML = '<span class="error">⚠️ Не удалось загрузить курсы. Используются резервные.</span>';
                rates = {
                    USD: 1,
                    AZN: 1.70,
                    EUR: 0.92,
                    TRY: 34.50,
                    RUB: 92.50,
                    IRR: 42000
                };
                renderGrid();
            }
        }

        function initConverter() {
            amountInput.addEventListener('input', renderGrid);

            baseSelect.addEventListener('change', () => {
                baseCurrency = baseSelect.value;
                renderGrid();
            });

            loadRates();
            passwordInput.value = '';
        }
    </script>
</body>
</html>
